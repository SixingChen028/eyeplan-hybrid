# Clean move-only robustness row: 1 WM decay x 3 costs x 10 matched seeds = 30 vmapped agents in one task.

[meta]
sim_trials = 5000

[sbatch]
time = "2:00:00"
gpu = true

[params]
use_recency_obs = false
t_max = 100
seed = [64, 65, 66, 67, 68, 69, 70, 71, 72, 73]
num_envs = 128
num_updates = 50_000
beta_e_init = 0.02
beta_e_final = 0.0
beta_e_anneal_updates = 50_000
forget_rate = 1.0

label = "wm_only"
wm_decay = 0.99
wm_neighbor_activation = 0.5
cost = [0.002, 0.005, 0.008]
