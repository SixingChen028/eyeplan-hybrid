# Distribution-aware parameter grid: 10 costs x 5 WM decays x 5 seeds = 250 agents.
# Each seed array task vmaps 10 costs x 5 WM decays = 50 agents.

[meta]
array_vars = ["seed"]
sim_trials = 5000

[sbatch]
time = "2:00:00"
gpu = true

[params]

use_recency_obs = false
t_max = 100
seed = [54, 55, 56, 57, 58]
num_envs = 128
num_updates = 50_000
forget_rate = 1.0

label = "wm_only"
wm_decay = [0.5, 0.75, 0.9, 0.975, 1.0]
wm_neighbor_activation = 0.5
cost = [0.001, 0.002, 0.005, 0.008, 0.01, 0.02, 0.04, 0.08, 0.12, 0.16]
beta_e_final = 0.01
