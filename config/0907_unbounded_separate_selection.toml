# Alternative-model option 2: select the unbounded model's cost separately on the main model's refined grid.
# Three costs x 10 fresh seeds = 30 vmapped agents in one task.

[meta]
sim_trials = 5000

[sbatch]
time = "03:59:00"
gpu = true

[params]
use_recency_obs = false
t_max = 100
cost = [0.002, 0.005, 0.008]
seed = [74, 75, 76, 77, 78, 79, 80, 81, 82, 83]
num_envs = 128
num_updates = 100_000
beta_e_init = 0.02
beta_e_final = 0.0
beta_e_anneal_updates = 100_000

label = "unbounded_separate_selection"
wm_decay = 1.0
wm_neighbor_activation = 1.0
disable_corruption = true
