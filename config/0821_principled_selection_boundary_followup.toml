# Fresh-seed follow-up for the shared upper decay and fixation-cost boundaries in the development screen.
# Boundary grid per seed: 3 decays x 2 neighbor activations x 3 costs x 2 final betas = 36 vmapped runs.
# A separate condition reruns the current hand-selected anchor, for 111 runs total across three seeds.

[meta]
array_vars = ["seed"]
sim_trials = 5000

[sbatch]
time = "2:00:00"
gpu = true

[params]

use_recency_obs = false
t_max = 100
seed = [44, 45, 46]
num_envs = 64
num_updates = 30_000
forget_rate = 1.0

[[conditions]]
label = "wm_only"
wm_decay = [0.975, 0.9875, 0.99]
wm_neighbor_activation = [0.25, 0.5]
cost = [0.01, 0.015, 0.02]
beta_e_final = [0.01, 0.015]

[[conditions]]
label = "wm_only"
wm_decay = 0.95
wm_neighbor_activation = 0.5
cost = 0.005
beta_e_final = 0.01
